<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>.</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="main">
      <div
        class="todo"
        style="text-align: center; font-size: 35px; font-weight: bold"
      >
        TODO LIST
      </div>

      <div class="parent">
        <div class="search">
          <input
            id="inputt"
            type="text"
            style="
              border-color: rgb(59, 59, 231);
              border-radius: 5px;
              font-size: 20px;
              height: 35px;
              width: 800px;
            "
            placeholder="Search note..."
          />
          <div class="lupa"></div>
        </div>

        <select name="all" id="selectall">
          <option value="ALL" id="all">ALL</option>
           <option value="CHECKED" id="checked">CHECKED</option>
            <option value="NOT CHECKED" id="notchecked">NOT CHECKED</option>
        </select>
        <button id="button2"></button>
      </div>

      <div id="main">
          <div class="notes">
          
             <div id="container_tasks"></div>
          </div>
          <button id="circle"></button>
      </div>
 
      <div id="modal" class="modal">
        <div id="modalcontent">
          <div class="newnote">NEW NOTE</div>
          <input
            id="inputtt"
            type="text"
            style="
              border-color: rgb(59, 59, 231);
              border-radius: 5px;
              font-size: 20px;
              height: 35px;
              width: 490px;
              margin-top: 20px;
            "
            placeholder="Input your note..."
          />

          <div id="buttons">
            <button id="cancel">CANCEL</button>
            <button id="apply">APPLY</button>
          </div>
        </div>
      </div>

      <div id="nf" class="hidden">
          <div id="nf2"  >
           <img src="notfound.png" 
                 alt="Ничего не найдено" 
                 id="notfound"
                 style=" width: 200px; height: 200px;">
           <p id="empty">Empty...</p>
          </div>
      </div>
    </div>
    

    <script src="index.js"></script>
    <script>

        //сохранениE задачи
        function saveTask(taskText) {
            let fd = new FormData();
            fd.append("task_text", taskText); 

            fetch("server/index.php", {
                method: "post",
                body: fd,
            })
            .then((response) => response.text())
            .then((resp) => {
                console.log(resp); 
            
            })
      
        }


      document.addEventListener("DOMContentLoaded", function () {
      

        const applyButton = document.getElementById("apply");
        const noteInputModal = document.getElementById("inputtt");

        if (applyButton && noteInputModal) {
            applyButton.addEventListener("click", function () {
                const taskText = noteInputModal.value.trim();
                if (taskText) {
                    saveTask(taskText);
                    noteInputModal.value = '';

              
                } 
                
            });
        }
      });
    </script>
  </body>
</html>
